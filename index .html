<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NexFlow CV Screener</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;padding:16px}
.box{background:white;border-radius:12px;padding:16px;margin-bottom:12px}
h1{font-size:18px;font-weight:700;color:#111;margin-bottom:6px}
p{font-size:13px;color:#666;line-height:1.5}
.label{font-size:13px;font-weight:700;color:#333;margin-bottom:6px;margin-top:14px;display:block}
input,textarea{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;color:#111;font-family:inherit;background:#fff;display:block}
textarea{min-height:80px;resize:none}
input:focus,textarea:focus{border-color:#1D9E75;outline:none}
#add-btn{
  display:block;
  width:100%;
  margin-top:10px;
  padding:14px;
  background:#1D9E75;
  color:white;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
#go-btn{
  display:block;
  width:100%;
  margin-top:4px;
  padding:16px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.cv-item{display:flex;justify-content:space-between;align-items:center;background:#f5fdf9;border:1px solid #b3e5d1;border-radius:8px;padding:10px 12px;margin-top:8px}
.cv-item span{font-size:13px;color:#111}
.cv-item button{background:#fee;border:1px solid #fcc;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700;color:#a32d2d;cursor:pointer}
#count{font-size:13px;font-weight:700;color:#1D9E75;margin-top:8px}
.err{background:#fff0f0;border:1px solid #fcc;border-radius:8px;padding:10px;font-size:13px;color:#a32d2d;margin-top:8px}
#loading{display:none;text-align:center;padding:40px 16px}
.spin{width:44px;height:44px;border:4px solid #eee;border-top:4px solid #1D9E75;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
#results{display:none}
.rcard{background:white;border-radius:12px;padding:16px;margin-bottom:12px;border:1.5px solid #eee}
.rcard.top{border-color:#1D9E75}
.rname{font-size:16px;font-weight:700;color:#111;margin-bottom:10px}
.srow{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:4px}
.sbar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-bottom:10px}
.sfill{height:100%;border-radius:4px;background:#1D9E75}
.sfill.mid{background:#EF9F27}
.sfill.low{background:#e24b4a}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.tg{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
.tg.g{background:#E1F5EE;color:#085041}
.tg.b{background:#FCEBEB;color:#a32d2d}
.verdict{font-size:13px;color:#555;line-height:1.6;border-top:1px solid #f0f0f0;padding-top:10px}
#retry-btn{display:block;width:100%;padding:14px;background:#eee;color:#333;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;margin-top:4px}
.foot{text-align:center;font-size:11px;color:#bbb;margin-top:16px}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup">
  <div class="box">
    <h1>NexFlow CV Screener</h1>
    <p>Powered by Claude AI &mdash; ranks your candidates instantly</p>
  </div>

  <div class="box">
    <span class="label">Job title</span>
    <input type="text" id="job-title" placeholder="e.g. Sales Executive">

    <span class="label">Job requirements</span>
    <textarea id="job-desc" placeholder="e.g. 3 years sales experience, good communication..."></textarea>
  </div>

  <div class="box">
    <span class="label">Paste one candidate CV at a time</span>
    <textarea id="cv-input" placeholder="Paste a candidate's CV text here..."></textarea>
    <div id="count">0 candidates added</div>
    <button id="add-btn" type="button">+ ADD CANDIDATE</button>
    <div id="cv-list"></div>
  </div>

  <div id="err-msg"></div>

  <button id="go-btn" type="button">SCREEN &amp; RANK CANDIDATES</button>
  <p class="foot">Built by NexFlow &middot; Powered by Claude AI</p>
</div>

<!-- LOADING -->
<div id="loading">
  <div class="spin"></div>
  <h2 id="load-txt" style="font-size:16px;font-weight:700;color:#111;margin-bottom:8px">Reading CVs...</h2>
  <p>Usually takes 15&ndash;30 seconds</p>
</div>

<!-- RESULTS -->
<div id="results">
  <div class="box">
    <h1 id="res-title">Results</h1>
  </div>
  <div id="res-list"></div>
  <button id="retry-btn" type="button">Screen another batch</button>
  <p class="foot">Built by NexFlow &middot; Powered by Claude AI</p>
</div>

<script>
var KEY = "YOUR_API_KEY_HERE";
var cvs = [];
var n = 0;

function doAdd() {
  var box = document.getElementById('cv-input');
  var txt = box.value.trim();
  if (!txt) { alert('Please paste a CV first!'); return; }
  n++;
  cvs.push({ id: n, text: txt });
  box.value = '';
  document.getElementById('count').textContent = cvs.length + ' candidate' + (cvs.length > 1 ? 's' : '') + ' added';
  var li = document.createElement('div');
  li.className = 'cv-item';
  li.id = 'cv' + n;
  li.innerHTML = '<span>📄 Candidate ' + n + '</span><button onclick="rmv(' + n + ')">Remove</button>';
  document.getElementById('cv-list').appendChild(li);
}

function rmv(id) {
  cvs = cvs.filter(function(c){ return c.id !== id; });
  var el = document.getElementById('cv' + id);
  if (el) el.remove();
  document.getElementById('count').textContent = cvs.length + ' candidate' + (cvs.length > 1 ? 's' : '') + ' added';
}

var msgs = ['Reading CVs...','Scoring candidates...','Ranking by fit...','Almost done...'];
var mt;

async function doScreen() {
  var title = document.getElementById('job-title').value.trim();
  var desc = document.getElementById('job-desc').value.trim();
  var err = document.getElementById('err-msg');
  err.innerHTML = '';
  if (!title) { err.innerHTML = '<div class="err">Please enter a job title.</div>'; return; }
  if (!desc) { err.innerHTML = '<div class="err">Please enter job requirements.</div>'; return; }
  if (!cvs.length) { err.innerHTML = '<div class="err">Please add at least one CV first.</div>'; return; }
  if (KEY === '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') { err.innerHTML = '<div class="err">Please add your API key to the code first.</div>'; return; }

  document.getElementById('setup').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  var mi = 0;
  var lt = document.getElementById('load-txt');
  mt = setInterval(function(){ mi=(mi+1)%msgs.length; lt.textContent=msgs[mi]; }, 3500);

  var block = cvs.map(function(c,i){ return '--- CANDIDATE '+(i+1)+' ---\n'+c.text; }).join('\n\n');
  var prompt = 'You are an expert HR screener.\n\nJOB TITLE: '+title+'\nREQUIREMENTS:\n'+desc+'\n\nCVs:\n'+block+'\n\nReturn ONLY a raw JSON array. No markdown. No backticks. No explanation. Each item: {"name":"...","score":0-100,"verdict":"2-3 sentences","strengths":["tag1","tag2"],"gaps":["tag1"]}. Sort by score descending.';

  try {
    var r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': KEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-calls':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1500,
        messages:[{role:'user',content:prompt}]
      })
    });
    clearInterval(mt);
    var d = await r.json();
    if (d.error) throw new Error(d.error.message);
    var raw = d.content.map(function(b){return b.text||'';}).join('');
    var data = JSON.parse(raw.replace(/```json|```/g,'').trim());
    showResults(data, title);
  } catch(e) {
    clearInterval(mt);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('setup').style.display = 'block';
    document.getElementById('err-msg').innerHTML = '<div class="err">Error: '+e.message+'</div>';
  }
}

function showResults(data, title) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('res-title').textContent = data.length + ' candidates ranked for: ' + title;
  var html = data.map(function(r,i){
    var rank = i+1;
    var sc = r.score >= 70 ? '' : r.score >= 45 ? 'mid' : 'low';
    var str = (r.strengths||[]).map(function(s){return '<span class="tg g">'+s+'</span>';}).join('');
    var gap = (r.gaps||[]).map(function(g){return '<span class="tg b">'+g+'</span>';}).join('');
    return '<div class="rcard'+(rank===1?' top':'')+'"><div class="rname">#'+rank+' &mdash; '+r.name+'</div><div class="srow"><span>Match score</span><span>'+Math.round(r.score)+'%</span></div><div class="sbar"><div class="sfill '+sc+'" style="width:'+Math.round(r.score)+'%"></div></div><div class="tags">'+str+gap+'</div><div class="verdict">'+r.verdict+'</div></div>';
  }).join('');
  document.getElementById('res-list').innerHTML = html;
}

function doReset() {
  cvs=[]; n=0;
  document.getElementById('job-title').value='';
  document.getElementById('job-desc').value='';
  document.getElementById('cv-input').value='';
  document.getElementById('cv-list').innerHTML='';
  document.getElementById('count').textContent='0 candidates added';
  document.getElementById('err-msg').innerHTML='';
  document.getElementById('res-list').innerHTML='';
  document.getElementById('results').style.display='none';
  document.getElementById('setup').style.display='block';
}

window.onload = function() {
  document.getElementById('add-btn').onclick = doAdd;
  document.getElementById('go-btn').onclick = doScreen;
  document.getElementById('retry-btn').onclick = doReset;
};
</script>
</body>
</html>
